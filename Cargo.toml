[package]
name = "domain_lookup"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
