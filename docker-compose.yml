services:
  lookup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lookup
    working_dir: /app
    volumes:
      - ./:/app
      - target_cache:/app/target
      - cargo_registry:/usr/local/cargo/registry
    #command: cargo watch -x run
    command: tail -f /dev/null
    networks:
      - lookup_network

networks:
  lookup_network:
    driver: bridge

volumes:
  target_cache:
  cargo_registry:

name: lookup
